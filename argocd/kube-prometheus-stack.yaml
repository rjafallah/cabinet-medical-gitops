apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.3.0
    helm:
      values: |
        alertmanager:
          enabled: false
        prometheusOperator:
          tls:
            enabled: false
          admissionWebhooks:
            enabled: false
        prometheus:
          additionalServiceMonitors:
            - name: cabinet-medical
              selector:
                matchLabels:
                  app: cabinet-medical
              namespaceSelector:
                matchNames:
                  - dev
              endpoints:
                - port: http
                  path: /actuator/prometheus
        grafana:
          adminPassword: admin
          service:
            type: NodePort
            nodePort: 30300
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki:3100
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  type: file
                  options:
                    path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              jvm:
                gnetId: 4701
                revision: 10
                datasource: Prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
