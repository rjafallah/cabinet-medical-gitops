apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabinet-medical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cabinet-medical
  template:
    metadata:
      labels:
        app: cabinet-medical
    spec:
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 8080
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysql:3306/cabinet_medical" }
            - { name: SPRING_DATASOURCE_USERNAME, value: amine }
            - { name: SPRING_DATASOURCE_PASSWORD, value: amine }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 768Mi
